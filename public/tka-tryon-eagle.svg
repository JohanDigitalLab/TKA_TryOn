      <path d="M328 260c-5 24-4 43 6 58 6 9 16 7 17-4l1-22"/>
      <path d="M370 260c5 24 4 43-6 58-6 9-16 7-17-4l-1-22"/>
      <path d="M413 252c17 21 25 42 24 65-1 12-11 16-19 6l-14-18"/>
