    <path fill="#475569" stroke="#172033" stroke-width="7" stroke-linejoin="round" d="M325 174C387 93 496 69 592 102c-67 16-112 51-143 91 56-22 111-18 154 7-80 5-137 34-176 74-25-37-55-67-102-100z"/>
    <path fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" d="M72 113c76 15 117 50 151 91M568 113c-76 15-117 50-151 91M74 184c61 2 111 26 148 58M566 184c-61 2-111 26-148 58" opacity=".75"/>
