      <path fill="#1e40af" d="M289 302h38l20 49 20-49h39l-40 83v43h-38v-43z"/>
      <path fill="#be123c" d="M404 302h38l22 74 22-74h38l-41 134h-38z"/>
      <path fill="url(#blue)" d="M177 302h112l-11 13H190z"/>
      <path fill="url(#blue)" d="M289 302h38l20 49-10 13-29-48z"/>
      <path fill="url(#red)" d="M404 302h38l22 74-11 18-27-79z"/>
    </g>
