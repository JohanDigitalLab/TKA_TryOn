    <path fill="#f8fafc" stroke="#172033" stroke-width="6" d="M287 146c-5-51 26-91 66-91s71 40 66 91c-4 34-29 58-66 58s-62-24-66-58z"/>
    <path fill="#f8fafc" stroke="#172033" stroke-width="6" d="M319 202l-32 39 35-18 31 23 31-23 35 18-32-39z"/>
    <path fill="#facc15" stroke="#92400e" stroke-width="5" d="M351 155l-45 20 44 19 45-19z"/>
    <circle cx="326" cy="132" r="7" fill="#172033"/><circle cx="374" cy="132" r="7" fill="#172033"/>
